[build]
target = "index.html"
dist = "dist"
# Features to enable for the WASM build
features = ["hydrate"]

[watch]
watch = ["src", "index.html", "styles"]

[serve]
port = 8080
open = false

# Proxy API requests to the backend server
[[proxy]]
rewrite = "/api/"
backend = "http://localhost:3000/api/"
