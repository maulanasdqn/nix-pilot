[workspace]
members = ["np-core", "np-api", "np-ui"]
resolver = "2"

[workspace.package]
name = "nix-pilot"
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/ms/nix-pilot"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "process"] }

# Web framework
axum = { version = "0.8", features = ["ws", "multipart"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Async utilities
futures = "0.3"
async-stream = "0.3"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID for IDs
uuid = { version = "1.0", features = ["v4", "serde"] }

# HTTP middleware
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Regex for text processing
regex = "1.11"

# Internal crates
np-core = { path = "np-core" }
strum = { version = "0.27", features = ["derive"] }

# Leptos UI components library
leptos_ui = "0.3"

# Tailwind CSS merge utility
tw_merge = "0.1"
